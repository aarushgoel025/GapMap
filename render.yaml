services:
  - type: web
    name: gapmap-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: CORS_ORIGINS
        value: "*"

